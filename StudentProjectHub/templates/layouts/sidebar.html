<aside class="dashboard-sidebar">
  {% if current_user.is_admin %}
    <div class="side-section-label">Admin</div>
    <a class="side-link" href="{{ url_for('admin.dashboard') }}"><span class="icon">📊</span> Dashboard</a>
    <a class="side-link" href="{{ url_for('admin.projects') }}"><span class="icon">📁</span> Projects</a>
    <a class="side-link" href="{{ url_for('admin.students') }}"><span class="icon">🎓</span> Students</a>
    <a class="side-link" href="{{ url_for('admin.analytics') }}"><span class="icon">📈</span> Analytics</a>
    <a class="side-link" href="{{ url_for('admin.notifications') }}"><span class="icon">🔔</span> Notifications</a>
    <a class="side-link" href="{{ url_for('admin.settings') }}"><span class="icon">⚙️</span> Settings</a>
  {% else %}
    <div class="side-section-label">My Account</div>
    <a class="side-link" href="{{ url_for('student.dashboard') }}"><span class="icon">🏠</span> Dashboard</a>
    <a class="side-link" href="{{ url_for('project.submit') }}"><span class="icon">➕</span> Submit Project</a>
    <a class="side-link" href="{{ url_for('project.my_projects') }}"><span class="icon">📁</span> My Projects</a>
    <a class="side-link" href="{{ url_for('student.downloads') }}"><span class="icon">⬇️</span> Downloads</a>
    <a class="side-link" href="{{ url_for('student.notifications') }}"><span class="icon">🔔</span> Notifications</a>
    <a class="side-link" href="{{ url_for('profile.edit') }}"><span class="icon">👤</span> Profile</a>
  {% endif %}
</aside>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
